name: AgentOps CI & Golden Evaluation Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  quality-tests-and-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Static lint check (Ruff)
        run: ruff check c4_architect_agent evaluations tests

      - name: Verify zero hardcoded credentials
        run: |
          ! grep -RInE "(AIza[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z]{20,}|BEGIN PRIVATE KEY)" c4_architect_agent evaluations tests terraform

      - name: Run unit and integration test suite
        run: pytest -v

      - name: Execute Golden Dataset Evaluation Regression Suite
        run: python -m evaluations.run_offline_eval
